[project]
name = "sba-928-chauncey-rutledge"
version = "0.1.0"
description = "SBA 928: Enhancing Market Research with AI Prompt Engineering - LoRA fine-tuning of flan-t5-small"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "torch",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sba_928_chauncey_rutledge"]
