[project]
name = "sba-928-chauncey-rutledge"
version = "0.1.0"
description = "Market-research prompt engineering and LoRA fine-tuning for SBA 928."
readme = "README.md"
authors = [
    { name = "Chauncey Rutledge", email = "YOUR-GITHUB-EMAIL" }
]
requires-python = ">=3.10"

dependencies = [
    "datasets>=5.0.1",
    "kagglehub>=0.3.12",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "trl",
    "accelerate",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "rouge-score",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
